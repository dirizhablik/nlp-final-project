# TF-IDF + Logistic Regression. Every (C, class_weight) pair is trained on train and
# scored on the validation split; the best by val F1 (sarcastic) is kept.
vectorizer:
  ngram_range: [1, 2]   # word unigrams + bigrams
  lowercase: true
  min_df: 2             # ignore n-grams seen in only one training tweet
  sublinear_tf: true    # 1 + log(tf)

grid:
  C: [0.01, 0.1, 1.0, 10.0, 100.0]   # inverse regularization strength (L2)
  class_weight: [null, balanced]     # null = no reweighting

# Fixed decision threshold on P(sarcastic). class_weight="balanced" already corrects
# for the imbalance. Tuning it for val F1 picked 0.40, which flags most tweets because
# val is 25% sarcastic, and that does not transfer to test (14%). To rerun that
# ablation, add:  threshold_search: {min: 0.05, max: 0.95, step: 0.05}
threshold: 0.5

max_iter: 2000
top_k_features: 20
