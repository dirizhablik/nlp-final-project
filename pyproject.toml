[project]
name = "isarcasm"
version = "0.1.0"
description = "Intended sarcasm detection on iSarcasmEval (SemEval-2022 Task 6, Subtask A, English)"
requires-python = ">=3.12"
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
